name: Check Markdown Links
on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-course-content.js'
      - '.github/workflows/readme-checker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Include hidden instruction and skill files so their source packs cannot drift.
      - name: Check every tracked Markdown cross-reference
        run: node scripts/check-course-content.js
      - name: List every tracked Markdown file
        run: git ls-files '*.md' > "$RUNNER_TEMP/course-markdown-files.txt"
      - name: Check external links in all tracked Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2 --timeout 30 --scheme https --scheme http
            --files-from ${{ runner.temp }}/course-markdown-files.txt
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
