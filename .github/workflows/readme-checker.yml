name: Check Markdown Links
on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/readme-checker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Limit the current course check to maintained entry points, not historical assets.
      - name: Check current course links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2 --timeout 30
            README.md COURSE-PLAN.md
            docs/CLASS-ACTIVITIES.md docs/QUICK-REFERENCE.md
            docs/GH-300-STUDY-GUIDE.md docs/HOOKS-AND-GOVERNANCE.md
            docs/MINI-MOCK.md docs/exam-notes-and-links.md
            copilot-metrics-tour/README.md src/GH-Copilot-Tips-App-README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
